# ATENCIÓ: EL LLOC ÉS BILINGÜE I ES RENDERITZA EN DOS PASSOS.
#
# Aquest fitxer només conté el que és COMÚ als dos idiomes. Tot el que
# canvia —menú, peu, idioma— és als dos perfils:
#
#     _quarto-en.yml   anglès, l'arrel del lloc
#     _quarto-ca.yml   català, sota /ca/
#
# L'anglès és el perfil per defecte (`profile: default: en` a baix), o
# sigui que `quarto render` a seques ja fa l'anglès.
#
# PER PUBLICAR, LES TRES COMANDES EN AQUEST ORDRE:
#
#     quarto render
#     quarto render --profile ca --no-clean
#     quarto publish gh-pages --no-render
#
# El `--no-clean` evita que el segon pas esborri l'anglès acabat de fer,
# i el `--no-render` que el tercer torni a construir el lloc, cosa que
# es carregaria el català.
#
# SI FAS NOMÉS `quarto publish gh-pages`, /ca/ DESAPAREIX DEL WEB.
#
# PER QUÈ NO HI HA MENÚ EN AQUEST FITXER: Quarto CONCATENA les llistes
# quan fusiona un perfil amb la base, no les substitueix. Si el menú
# anglès fos aquí, el perfil català hi afegiria el seu a sota i sortirien
# els dos junts. Per això cada menú viu al seu perfil i aquí no n'hi ha
# cap. El mateix val per a la llista de `render`.

project:
  type: website
  output-dir: _site
  # El fitxer CNAME és el que diu a GitHub Pages quin és el domini propi.
  # Ha d'anar a _site perquè `quarto publish gh-pages` reescriu la branca
  # sencera: si no es copiés, cada publicació esborraria el domini.
  resources:
    - CNAME

# Sense això, `quarto render` a seques construiria un lloc sense menú.
profile:
  default: en

website:
  title: "Rafel Cirer-Sastre"
  site-url: "https://rafelcirer.com"
  description: "Associate Professor of Kinesiology at INEFC Lleida. Strength and muscle mechanics, field-test validation, and cardiac biomarkers after exercise."
  favicon: images/favicon.svg
  open-graph: true
  # La imatge que ensenyen LinkedIn, Bluesky o un xat quan algú comparteix un
  # enllaç del lloc. Abans hi havia una foto d'estoc d'una aula. Ara és una
  # targeta tipogràfica amb el nom, el càrrec i la frase del lloc, feta per
  # `python3 scripts/targeta-social.py`. És una imatge com qualsevol altra:
  # el lloc no necessita res per servir-la.
  image: images/social-card.png

format:
  html:
    # Dues paletes. `theme.scss` porta tot el disseny i es compila dues
    # vegades; `theme-dark.scss` només hi canvia els colors. Quarto posa sol
    # l'interruptor de sol/lluna a la barra de dalt, i recorda l'elecció del
    # lector. Per treure el mode fosc, deixa-hi només la línia `light`.
    theme:
      light: [cosmo, theme.scss]
      dark: [cosmo, theme.scss, theme-dark.scss]
    toc: true
    anchor-sections: true
    # ÚNICA dependència de JavaScript de tercers del lloc (CLAUDE.md §3).
    # Són ~3 KB, es carrega de manera asíncrona i, si el servei desaparegués,
    # falla en silenci sense trencar res. Per treure l'analítica del lloc,
    # esborra aquestes tres línies i la nota del peu.
    include-in-header:
      - text: |
          <script data-goatcounter="https://rcirer.goatcounter.com/count"
                  async src="https://gc.zgo.at/count.js"></script>
