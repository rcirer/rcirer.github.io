project:
  type: website
  output-dir: _site
  # Només els .qmd són pàgines del lloc. Sense això, Quarto publicaria també
  # qualsevol .md de la carpeta (CLAUDE.md, cv-extracte-web.md...), que són
  # documents interns i no han de sortir al web.
  render:
    - "**/*.qmd"
  # El fitxer CNAME és el que diu a GitHub Pages quin és el domini propi.
  # Ha d'anar a _site perquè `quarto publish gh-pages` reescriu la branca
  # sencera: si no es copiés, cada publicació esborraria el domini.
  resources:
    - CNAME

website:
  title: "Rafel Cirer-Sastre"
  site-url: "https://rcirer.github.io"
  description: "Associate Professor of Kinesiology at INEFC Lleida. Strength and muscle mechanics, field-test validation, and cardiac biomarkers after exercise."
  favicon: images/favicon.svg
  open-graph: true
  image: images/lecture-hall.jpg
  navbar:
    # Lloc en anglès per defecte. Teaching és l'única pàgina en català,
    # perquè el seu públic són els estudiants d'aquí (CLAUDE.md §5).
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: publications.qmd
        text: Publications
      # Blog amagat del menú fins que hi hagi un primer post publicat: un
      # apartat buit resta credibilitat. La pàgina segueix existint a
      # /blog/; per tornar-la a mostrar, descomenta aquestes dues línies.
      # - href: blog/index.qmd
      #   text: Blog
      - href: teaching.qmd
        text: Teaching
      - href: phd.qmd
        text: PhD
      - href: cv.qmd
        text: CV
    right:
      - text: ORCID
        href: https://orcid.org/0000-0001-6687-8201
  page-footer:
    center: |
      Rafel Cirer-Sastre · INEFC Lleida, Universitat de Lleida<br>
      <span class="footer-note">No cookies. Anonymous, aggregate visit counts via
      <a href="https://www.goatcounter.com/">GoatCounter</a>, which stores no IP addresses.</span>

format:
  html:
    theme: [cosmo, theme.scss]
    toc: true
    # El lloc és en anglès: aquest text sortia en català a totes les pàgines.
    # teaching.qmd, que sí que és en català, el sobreescriu al seu capçal.
    toc-title: "On this page"
    anchor-sections: true
    # ÚNICA dependència de JavaScript de tercers del lloc (CLAUDE.md §3).
    # Són ~3 KB, es carrega de manera asíncrona i, si el servei desaparegués,
    # falla en silenci sense trencar res. Per treure l'analítica del lloc,
    # esborra aquestes tres línies i la nota del peu.
    include-in-header:
      - text: |
          <script data-goatcounter="https://rcirer.goatcounter.com/count"
                  async src="https://gc.zgo.at/count.js"></script>

# Idioma per defecte del lloc. Importa per als lectors de pantalla, que
# apliquen les regles de pronunciació segons aquest atribut.
lang: en

# Per defecte, Quarto etiqueta el camp de data com a "Published". Al CV la
# data és la de l'últim canvi, i dir-ne "publicat" enganya.
language:
  title-block-published: "Last updated"
