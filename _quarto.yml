project:
  type: website
  output-dir: _site
  # Només els .qmd són pàgines del lloc. Sense això, Quarto publicaria també
  # qualsevol .md de la carpeta (CLAUDE.md, cv-extracte-web.md...), que són
  # documents interns i no han de sortir al web.
  render:
    - "**/*.qmd"

website:
  title: "Rafel Cirer-Sastre"
  site-url: "https://rcirer.github.io"
  description: "Professor Titular de Cinesiologia a l'INEFC Lleida. Biomarcadors cardíacs, valoració del rendiment i mecànica muscular."
  navbar:
    # Lloc en anglès per defecte. Teaching és l'única pàgina en català,
    # perquè el seu públic són els estudiants d'aquí (CLAUDE.md §5).
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: publications.qmd
        text: Publications
      - href: blog/index.qmd
        text: Blog
      - href: teaching.qmd
        text: Teaching
      - href: phd.qmd
        text: PhD
      - href: cv.qmd
        text: CV
    right:
      - text: ORCID
        href: https://orcid.org/0000-0001-6687-8201
  page-footer:
    center: "Rafel Cirer-Sastre · INEFC Lleida, Universitat de Lleida"

format:
  html:
    theme: litera
    toc: true
    toc-title: "En aquesta pàgina"
    anchor-sections: true
