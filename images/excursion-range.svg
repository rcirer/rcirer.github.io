<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d">
  <title id="t">Muscle length range and the voluntary excursion range</title>
  <desc id="d">A muscle spans a range of lengths from its minimum passive length to its maximum passive length. Between the inner limit (maximum voluntary shortening) and the outer limit (maximum voluntary lengthening) lies the voluntary excursion range, which is the portion strength training can actually load.</desc>

  <style>
    .tag   { font: 700 11px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0e6b5e; letter-spacing: 0.09em; }
    .lim   { font: 600 12.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0e6b5e; }
    .lbl   { font: 400 12.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #5c6670; }
    .ask   { font: 600 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #15181b; }
    .note  { font: 400 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #5c6670; }
  </style>

  <text class="tag" x="60" y="34">MUSCLE LENGTH</text>

  <!-- banda del rang voluntari -->
  <rect x="352" y="104" width="330" height="232" fill="#0e6b5e" opacity="0.07"/>
  <text class="lim" x="517" y="126" text-anchor="middle">voluntary excursion range</text>

  <!-- fites -->
  <line x1="90"  y1="104" x2="90"  y2="336" stroke="#5c6670" stroke-width="2"/>
  <line x1="286" y1="104" x2="286" y2="336" stroke="#c9ced2" stroke-width="1.5"/>
  <line x1="352" y1="104" x2="352" y2="336" stroke="#0e6b5e" stroke-width="2"/>
  <line x1="500" y1="104" x2="500" y2="336" stroke="#c9ced2" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="682" y1="104" x2="682" y2="336" stroke="#0e6b5e" stroke-width="2"/>
  <line x1="800" y1="104" x2="800" y2="336" stroke="#c9ced2" stroke-width="1.5"/>

  <!-- fibres, de la més curta a la més llarga -->
  <ellipse cx="188" cy="152" rx="98"  ry="12" fill="#c9825f" opacity="0.55"/>
  <ellipse cx="221" cy="192" rx="131" ry="12" fill="#c9825f" opacity="0.55"/>
  <ellipse cx="295" cy="232" rx="205" ry="12" fill="#c9825f" opacity="0.55"/>
  <ellipse cx="386" cy="272" rx="296" ry="12" fill="#c9825f" opacity="0.55"/>
  <ellipse cx="445" cy="312" rx="355" ry="12" fill="#c9825f" opacity="0.55"/>

  <!-- etiquetes -->
  <text class="lbl" x="96"  y="96">origin</text>

  <text class="lbl" x="286" y="358" text-anchor="middle">minimum</text>
  <text class="lbl" x="286" y="374" text-anchor="middle">passive length</text>

  <text class="lim" x="352" y="358" text-anchor="middle">inner limit</text>
  <text class="lbl" x="352" y="374" text-anchor="middle">max. voluntary</text>
  <text class="lbl" x="352" y="390" text-anchor="middle">shortening</text>

  <text class="lbl" x="500" y="358" text-anchor="middle">resting length</text>

  <text class="lim" x="682" y="358" text-anchor="middle">outer limit</text>
  <text class="lbl" x="682" y="374" text-anchor="middle">max. voluntary</text>
  <text class="lbl" x="682" y="390" text-anchor="middle">lengthening</text>

  <text class="lbl" x="880" y="358" text-anchor="end">maximum</text>
  <text class="lbl" x="880" y="374" text-anchor="end">passive length</text>

  <!-- pregunta -->
  <text class="note" x="60" y="436">Training loads only part of the voluntary range.</text>
  <text class="ask"  x="60" y="458">Does it matter which part?</text>
</svg>
