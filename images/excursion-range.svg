<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="exc-t exc-d">
  <title id="exc-t">The four muscle excursion ranges compared in EXCURSE</title>
  <desc id="exc-d">Four muscles are drawn one above another on a horizontal muscle length axis, all fixed at the same origin on the left. Each is a rounded rectangle standing for the muscle belly, joined by a short tendon at either end to two marked attachment points: a fixed proximal one at the origin and a distal one that moves. Two vertical lines mark the shortening limit, the shortest length the muscle reaches voluntarily, and the lengthening limit, the longest; a dashed line between them marks the resting length. Each muscle shortens and lengthens only within its own excursion range: IMER works against the shortening limit and stays shorter than resting length, OMER works against the lengthening limit and stays longer than resting length, MMER straddles resting length without reaching either limit, and CMER travels the whole distance from one limit to the other. The belly thickens as it shortens and thins as it lengthens, while the tendons keep their length. A bar under each muscle marks the travel of its distal attachment, which is that muscle excursion range.</desc>

  <style>
    .lim  { font: 600 14px system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #0e6b5e; }
    .sub  { font: 400 13px system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #5c6670; }
    .acr  { font: 700 15px system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #15181b; }
    .glo  { font: 400 12.5px system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #5c6670; }
    .axn  { font: 700 12px system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #5c6670; letter-spacing: 0.1em; }
    .note { font: 400 13px system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #5c6670; }
    .rng  { font: 400 12.5px system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #a2603f; }
    .belly { fill: #c9825f; fill-opacity: 0.78; stroke: #a2603f; stroke-width: 1.2; }
    .tend  { stroke: #a2603f; stroke-width: 3; stroke-linecap: round; }
    .ins   { fill: #a2603f; }
    .trav  { stroke: #a2603f; stroke-width: 1.4; fill: none; }
  </style>

  <!-- =====================================================================
       COM ESTÀ FET
       Tots els músculs neixen a l'origen x=150. Límit d'escurçament x=330,
       longitud de repòs x=530, límit d'allargament x=810. Cada fila té:
       tendó fix (150→168), panxa (rectangle que comença sempre a x=168 i
       canvia d'amplada), tendó mòbil i inserció distal. La panxa engreixa
       en escurçar-se: gruix = 470/√amplada, de manera que el volum es manté.
       Els tendons no canvien de llarg.

       Recorregut de la inserció distal, per fila:
         IMER 330→510 · MMER 450→670 · OMER 630→810 · CMER 330→810

       Les quatre files van totes alhora (begin="0s"). És deliberat: així,
       en qualsevol instant, les quatre insercions són al mateix punt de la
       mateixa repetició i la diferència que es veu és la condició, no la
       fase. Si algun dia les vols desfasades un quart de cicle, posa
       begin="-1.5s", "-3s" i "-4.5s" a les files 2, 3 i 4. Tots els
       <animate> d'una mateixa fila han de dur el MATEIX begin, o la fila
       es desmunta.

       RITME 1:3. El cicle dura 6 s i keyTimes="0;0.75;1" el parteix en
       dos trams desiguals: del 0 al 75 % el múscul s'allarga (excèntrica,
       4,5 s) i del 75 % al 100 % s'escurça (concèntrica, 1,5 s). Per canviar
       el ritme, toca keyTimes a TOTS els <animate>: 0.5 seria 1:1 i 0.6667
       seria 1:2. La durada total es canvia amb dur.

       Per moure una fila, canvia els dos valors de cada <animate> d'aquella
       fila.
       ===================================================================== -->

  <!-- fites -->
  <text class="sub" x="150" y="82" text-anchor="middle">origin</text>

  <text class="lim" x="330" y="64" text-anchor="middle">shortening limit</text>
  <text class="sub" x="330" y="82" text-anchor="middle">shortest voluntary length</text>

  <text class="sub" x="530" y="82" text-anchor="middle">resting length</text>

  <text class="lim" x="810" y="64" text-anchor="middle">lengthening limit</text>
  <text class="sub" x="810" y="82" text-anchor="middle">longest voluntary length</text>

  <line x1="150" y1="96" x2="150" y2="376" stroke="#c3cacd" stroke-width="1.5"/>
  <line x1="330" y1="96" x2="330" y2="376" stroke="#0e6b5e" stroke-width="1.6"/>
  <line x1="530" y1="96" x2="530" y2="376" stroke="#c3cacd" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="810" y1="96" x2="810" y2="376" stroke="#0e6b5e" stroke-width="1.6"/>

  <!-- ============================ IMER ============================ -->
  <text class="acr" x="128" y="124" text-anchor="end">IMER</text>
  <text class="glo" x="128" y="141" text-anchor="end">concentric end</text>

  <line class="tend" x1="150" y1="128" x2="168" y2="128"/>
  <circle class="ins" cx="150" cy="128" r="4.5"/>
  <rect class="belly" x="168" y="108.4" width="144" height="39.2" rx="9">
    <animate attributeName="width"  values="144;324;144"       dur="6s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.75;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <animate attributeName="height" values="39.2;26.1;39.2"    dur="6s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.75;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <animate attributeName="y"      values="108.4;114.9;108.4" dur="6s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.75;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </rect>
  <line class="tend" x1="312" y1="128" x2="330" y2="128">
    <animate attributeName="x1" values="312;492;312" dur="6s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.75;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <animate attributeName="x2" values="330;510;330" dur="6s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.75;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </line>
  <circle class="ins" cx="330" cy="128" r="4.5">
    <animate attributeName="cx" values="330;510;330" dur="6s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.75;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </circle>
  <path class="trav" d="M330 152 v12 M330 158 H510 M510 152 v12"/>
  <text class="rng" x="545" y="162">excursion range: how far the insertion travels</text>

  <!-- ============================ MMER ============================ -->
  <text class="acr" x="128" y="192" text-anchor="end">MMER</text>
  <text class="glo" x="128" y="209" text-anchor="end">neither extreme</text>

  <line class="tend" x1="150" y1="196" x2="168" y2="196"/>
  <circle class="ins" cx="150" cy="196" r="4.5"/>
  <rect class="belly" x="168" y="181.6" width="264" height="28.9" rx="9">
    <animate attributeName="width"  values="264;484;264"       dur="6s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.75;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <animate attributeName="height" values="28.9;21.4;28.9"    dur="6s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.75;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <animate attributeName="y"      values="181.6;185.3;181.6" dur="6s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.75;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </rect>
  <line class="tend" x1="432" y1="196" x2="450" y2="196">
    <animate attributeName="x1" values="432;652;432" dur="6s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.75;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <animate attributeName="x2" values="450;670;450" dur="6s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.75;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </line>
  <circle class="ins" cx="450" cy="196" r="4.5">
    <animate attributeName="cx" values="450;670;450" dur="6s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.75;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </circle>
  <path class="trav" d="M450 220 v12 M450 226 H670 M670 220 v12"/>

  <!-- ============================ OMER ============================ -->
  <text class="acr" x="128" y="260" text-anchor="end">OMER</text>
  <text class="glo" x="128" y="277" text-anchor="end">eccentric end</text>

  <line class="tend" x1="150" y1="264" x2="168" y2="264"/>
  <circle class="ins" cx="150" cy="264" r="4.5"/>
  <rect class="belly" x="168" y="252.9" width="444" height="22.3" rx="9">
    <animate attributeName="width"  values="444;624;444"       dur="6s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.75;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <animate attributeName="height" values="22.3;18.8;22.3"    dur="6s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.75;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <animate attributeName="y"      values="252.9;254.6;252.9" dur="6s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.75;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </rect>
  <line class="tend" x1="612" y1="264" x2="630" y2="264">
    <animate attributeName="x1" values="612;792;612" dur="6s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.75;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <animate attributeName="x2" values="630;810;630" dur="6s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.75;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </line>
  <circle class="ins" cx="630" cy="264" r="4.5">
    <animate attributeName="cx" values="630;810;630" dur="6s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.75;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </circle>
  <path class="trav" d="M630 288 v12 M630 294 H810 M810 288 v12"/>

  <!-- ============================ CMER ============================ -->
  <text class="acr" x="128" y="326" text-anchor="end">CMER</text>
  <text class="glo" x="128" y="343" text-anchor="end">limit to limit</text>

  <line class="tend" x1="150" y1="330" x2="168" y2="330"/>
  <circle class="ins" cx="150" cy="330" r="4.5"/>
  <rect class="belly" x="168" y="310.4" width="144" height="39.2" rx="9">
    <animate attributeName="width"  values="144;624;144"       dur="6s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.75;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <animate attributeName="height" values="39.2;18.8;39.2"    dur="6s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.75;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <animate attributeName="y"      values="310.4;320.6;310.4" dur="6s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.75;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </rect>
  <line class="tend" x1="312" y1="330" x2="330" y2="330">
    <animate attributeName="x1" values="312;792;312" dur="6s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.75;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <animate attributeName="x2" values="330;810;330" dur="6s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.75;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </line>
  <circle class="ins" cx="330" cy="330" r="4.5">
    <animate attributeName="cx" values="330;810;330" dur="6s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.75;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </circle>
  <path class="trav" d="M330 356 v12 M330 362 H810 M810 356 v12"/>

  <!-- eix -->
  <line x1="150" y1="392" x2="872" y2="392" stroke="#5c6670" stroke-width="1.5"/>
  <path d="M870 386 L884 392 L870 398 Z" fill="#5c6670"/>
  <text class="axn" x="150" y="414">MUSCLE LENGTH</text>

  <text class="note" x="150" y="440">The four ranges are anchored to the two limits and individualised per participant, muscle and exercise.</text>
</svg>
